services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  database:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_attendance:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - database

volumes:
  postgres_attendance: